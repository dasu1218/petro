name: Verify Petro
on:
  pull_request:
  push:
    branches: [main, develop, 'feature/**']
permissions:
  contents: read
env:
  MONGOMS_DISABLE_POSTINSTALL: '1'
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            petro-api/package-lock.json
            petro-web/package-lock.json
      - run: npm ci --prefix petro-api
      - run: npm ci --prefix petro-web
      - run: npm run verify
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: petro-web/package-lock.json
      - run: npm ci --prefix petro-web
      - run: npx playwright install --with-deps chromium
        working-directory: petro-web
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-smoke-report
          path: |
            petro-web/playwright-report/
            petro-web/test-results/
          retention-days: 7

  inventory-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: petro-api/package-lock.json
      - run: npm ci --prefix petro-api
      - run: npm run test:integration
